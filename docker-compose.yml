services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel-api-kit-app
    working_dir: /var/www
    ports:
      - "8080:8080"
    volumes:
      - ./:/var/www
      - ./docker/frankenphp/Caddyfile:/etc/caddy/Caddyfile
    command: ["php", "artisan", "octane:frankenphp", "--host=0.0.0.0", "--port=8080", "--workers=4"]
    environment:
      - OCTANE_SERVER=frankenphp

  db:
    image: postgres:16-alpine
    container_name: laravel-api-kit-db
    environment:
      POSTGRES_DB: laravel_api
      POSTGRES_USER: laravel
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: laravel-api-kit-pgadmin
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: secret
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      - db

volumes:
  db-data:
  pgadmin-data:
