services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel-api-kit-app
    working_dir: /var/www
    volumes:
      - ./:/var/www
    command: ["php-fpm"]

  web:
    image: nginx:alpine
    container_name: laravel-api-kit-web
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  db:
    image: postgres:16-alpine
    container_name: laravel-api-kit-db
    environment:
      POSTGRES_DB: laravel_api
      POSTGRES_USER: laravel
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  phppgadmin:
    image: dockage/phppgadmin:latest
    container_name: laravel-api-kit-phppgadmin
    ports:
      - "5050:80"
    environment:
      PHP_PG_ADMIN_SERVER_HOST: db
      PHP_PG_ADMIN_SERVER_PORT: 5432
    depends_on:
      - db

  node:
    image: node:22-alpine
    container_name: laravel-api-kit-node
    working_dir: /var/www
    volumes:
      - ./:/var/www
    command: sh -c "npm install && npm run build"

volumes:
  db-data:
