version: '3.8'

x-logging: &default-logging
  driver: 'json-file'
  options:
    max-size: "50m"
    max-file: "10"
    compress: "true"

x-healthcheck: &default-healthcheck
  interval: 5s
  retries: 3
  timeout: 3s

x-base: &base
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  build:
    context: .
    dockerfile: Dockerfile.production
    args:
      USER_ID: ${HOST_UID:-1000}
      GROUP_ID: ${HOST_GID:-1000}
  image: '${DOCKER_IMAGE_NAME:-laravel-api-kit/app}:${DOCKER_IMAGE_TAG:-latest}'
  networks:
    - app-network
  logging: *default-logging
  restart: unless-stopped
  env_file:
    - .env.production

services:
  app:
    <<: *base
    container_name: ${APP_CONTAINER_NAME:-laravel-api-app}
    ports:
      - "${APP_PORT:-80}:8000"
    healthcheck:
      test: ["CMD", "healthcheck"]
      <<: *default-healthcheck

  scheduler:
    <<: *base
    container_name: ${SCHEDULER_CONTAINER_NAME:-laravel-api-scheduler}
    environment:
      CONTAINER_MODE: scheduler


  db:
    image: 'postgres:16-alpine'
    container_name: ${DB_CONTAINER_NAME:-laravel-api-db}
    environment:
      POSTGRES_DB: '${DB_DATABASE:-laravel}'
      POSTGRES_USER: '${DB_USERNAME:-laravel}'
      POSTGRES_PASSWORD: '${DB_PASSWORD:-secret}'
    volumes:
      - 'db-data:/var/lib/postgresql/data'
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      <<: *default-healthcheck
    restart: unless-stopped
    logging: *default-logging

  redis:
    image: 'redis:7-alpine'
    container_name: ${REDIS_CONTAINER_NAME:-laravel-api-redis}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-secret}"]
    volumes:
      - 'redis-data:/data'
    networks:
      - app-network
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "--pass", "${REDIS_PASSWORD:-secret}", "ping"]
      <<: *default-healthcheck
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  db-data:
  redis-data:
